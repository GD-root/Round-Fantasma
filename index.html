<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Boxe de sombra diário em três níveis, com cronômetro guiado por voz e boneco animado que mostra cada movimento.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Round Fantasma">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Round Fantasma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#13203A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de academia em abas (Hoje, Plano, Técnicas, Progresso), cartão escuro de "corner" no topo com o boneco-fantasma fazendo sombra, barra de navegação fixa embaixo */
:root{
  --bg:#E6EAEE; --panel:#F6F8F9; --panel2:#EDF0F3; --ink:#13203A; --muted:#5A667A; --line:#CCD3DC;
  --rope:#B42A23; --bell:#B7841F; --rest:#2F6F5E;
  --herobg:#13203A; --herofg:#F2F4F7; --heromuted:#A8B3C7; --heroline:#2A3958;
  --figl:var(--rope); --figr:var(--ink); --fighd:var(--panel);
  --display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1322;--panel:#151F36;--panel2:#1A2540;--ink:#E7ECF3;--muted:#98A3B8;--line:#263250;
  --rope:#E3554C;--bell:#E2B04C;--rest:#5CB39A;--herobg:#18243F;--herofg:#F2F4F7;--heromuted:#A8B3C7;--heroline:#2E3D60;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1322;--panel:#151F36;--panel2:#1A2540;--ink:#E7ECF3;--muted:#98A3B8;--line:#263250;
  --rope:#E3554C;--bell:#E2B04C;--rest:#5CB39A;--herobg:#18243F;--herofg:#F2F4F7;--heromuted:#A8B3C7;--heroline:#2E3D60;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--bell);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;line-height:1;text-wrap:balance;font-weight:900}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.brand span{color:var(--rope)}
.brand svg{width:26px;height:26px}
.chips{margin-left:auto;display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border:1px solid var(--line);background:var(--panel);border-radius:999px;white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip span svg{width:16px;height:16px}
@media (max-width:420px){.top{gap:6px}.chips{gap:4px}.hand{width:30px;height:30px;font-size:17px}.brand{font-size:19px;gap:5px}.brand svg{display:none}.chip{padding:5px 8px;font-size:12px}.chip .lvname{display:none}.conf,.conf svg{width:42px;height:39px}}
.chip.hot{color:var(--rope);border-color:var(--rope)}

/* abas */
.tab{display:none;flex-direction:column;gap:22px;animation:tabin .28s ease}
.tab.on{display:flex}
@keyframes tabin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tab{animation:none}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:26px}

/* hero */
.hero{position:relative;background:var(--herobg);color:var(--herofg);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;min-height:280px;isolation:isolate}
.hero::before{content:"";position:absolute;left:0;right:0;top:18px;height:16px;background:linear-gradient(var(--rope),var(--rope)) 0 0/100% 2px no-repeat,linear-gradient(#ffffff55,#ffffff55) 0 7px/100% 2px no-repeat,linear-gradient(var(--rope),var(--rope)) 0 14px/100% 2px no-repeat;opacity:.55;z-index:-1}
.hero-txt{padding:52px 20px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero .eyebrow{color:var(--heromuted)}
.hero h1{font-size:clamp(40px,8vw,64px)}
.hero h1 em{font-style:normal;color:var(--rope)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--heroline);border-radius:999px;color:var(--heromuted)}
.hero-fig{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:30px 8px 14px;min-width:0}
.hero-fig .fig{width:100%;max-width:260px;height:auto;--figl:var(--rope);--figr:var(--herofg);--fighd:var(--herobg)}
.hero-fig .fig .fground{stroke:var(--heroline)}
.callout{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;min-height:24px;color:var(--bell);text-align:center}
.cta{appearance:none;border:0;cursor:pointer;background:var(--rope);color:#fff;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:16px;padding:15px 22px;border-radius:12px;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;box-shadow:0 6px 0 #00000033;transition:transform .12s,box-shadow .12s}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #00000033}
.cta svg{width:18px;height:18px}
.ghostbtn{appearance:none;cursor:pointer;background:transparent;border:1.5px solid currentColor;color:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:10px 14px;border-radius:10px}
.hero .ghostbtn{color:var(--heromuted)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:auto;padding-top:8px}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero-fig{order:-1;padding:34px 8px 0;max-height:250px}.hero-fig .fig{max-width:210px}.hero-txt{padding-top:6px}}

/* semana */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wd b{font-family:var(--display);font-size:22px;font-weight:900;line-height:1}
.wd small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wd i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.wd.done{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.wd.done small{color:var(--panel);opacity:.7}.wd.done i{background:var(--bell)}
.wd.cur{border:2px solid var(--rope)}.wd.cur i{background:var(--rope)}
.wd.sel{box-shadow:0 0 0 3px var(--bell) inset}
.wd.rec{border-style:dashed}

/* cartões */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:22px}
.techrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.tchip{appearance:none;cursor:pointer;flex:0 0 auto;width:118px;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:start;text-align:center}
.tchip .fig{width:96px;height:96px}
.tchip span{font-size:13px;font-weight:700;line-height:1.2}
.tchip em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rope)}
.tchip:hover{border-color:var(--ink)}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:7px 0;position:relative}
.tl li::before{content:"";position:absolute;left:8px;top:22px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:14px;height:14px;border-radius:50%;margin-top:4px;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--muted);background:var(--muted)}
.tl .dot.round{background:var(--rope);box-shadow:0 0 0 2px var(--rope)}
.tl .dot.cond{background:var(--bell);box-shadow:0 0 0 2px var(--bell)}
.tl .dot.warm,.tl .dot.cool{background:var(--rest);box-shadow:0 0 0 2px var(--rest)}
.tl .nm{font-weight:600;min-width:0}
.tl .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tl .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.cloud{display:flex;flex-wrap:wrap;gap:6px}
.cloud span{font-size:14px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.mus{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.mus svg{flex:0 0 22px;width:22px;height:22px;color:var(--rope)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:11px 15px;border-radius:10px}
.btn.primary{background:var(--rope);border-color:var(--rope);color:#fff}
.banner{padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--bell);display:flex;gap:12px;align-items:center}
.banner svg{flex:0 0 44px;width:44px;height:44px;color:var(--bell)}
.linkbtn{appearance:none;background:none;border:0;padding:0;font-weight:700;color:var(--rope);text-decoration:underline;cursor:pointer}

/* níveis */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:620px){.levels{grid-template-columns:1fr}}
.lvl{appearance:none;cursor:pointer;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto auto;gap:4px 12px;align-items:center;min-width:0;transition:transform .15s,border-color .15s}
.lvl:hover{transform:translateY(-2px);border-color:var(--ink)}
.lvl .ic{grid-row:1/4;width:64px;height:64px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;color:var(--muted)}
.lvl .ic svg{width:48px;height:48px}
.lvl .ln{font-family:var(--display);font-size:24px;font-weight:900;text-transform:uppercase;line-height:1}
.lvl .lw{font-size:13px;color:var(--muted);line-height:1.35}
.lvl .steps{display:flex;gap:4px;align-items:center}
.lvl .steps i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.lvl .steps i.f{background:var(--rope)}
.lvl .steps small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px;white-space:nowrap}
.lvl.on{border:2px solid var(--rope)}
.lvl.on .ic{background:var(--rope);color:#fff}
.lvl.on .ln{color:var(--rope)}
.lvl[data-k="avancado"] .steps i.f{background:var(--bell)}
.lvl.on[data-k="avancado"] .ic{background:var(--bell);color:#1b1405}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.phase{border-radius:12px;padding:12px;background:var(--panel2);border:1px solid var(--line);min-width:0}
.phase b{display:block;font-family:var(--display);font-size:18px;text-transform:uppercase;font-weight:800}
.phase p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.phase.now{border:2px solid var(--rope)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav h3{font-size:20px;flex:1;min-width:0}
.wbtn{appearance:none;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:8px;text-transform:uppercase;letter-spacing:.06em}
.wbtn:disabled{opacity:.35;cursor:default}

/* técnicas */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{appearance:none;cursor:pointer;flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px}
.filters button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start;min-width:0}
.tcard .fig{width:76px;height:80px;background:var(--panel2);border-radius:10px}
.tcard h4{margin:0;font-size:16px;line-height:1.2}
.tcard h4 b{font-family:var(--display);color:var(--rope);font-size:20px;margin-right:4px}
.tcard p{margin:4px 0 8px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#1b1405;background:var(--bell);padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.vbtn{appearance:none;cursor:pointer;border:0;background:var(--ink);color:var(--panel);border-radius:8px;padding:7px 11px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.vbtn svg{width:12px;height:12px}

/* progresso */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:38px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;overflow-x:auto}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--panel2);border:1px solid var(--line);min-width:14px}
.heat i.on{background:var(--rope);border-color:var(--rope)}
.heat i.today{outline:2px solid var(--bell);outline-offset:1px}
.lbar{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.lbar div{height:10px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.lbar div i{display:block;height:100%;background:var(--rope)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-weight:600}
.switch{appearance:none;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;border:0;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--rope)}
.switch[aria-checked="true"]::after{left:23px}
textarea{width:100%;min-height:70px;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.note{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:60}

/* mão e estilos */
.hand{appearance:none;cursor:pointer;width:34px;height:34px;border-radius:50%;border:2px solid var(--rope);background:var(--rope);color:#fff;font-family:var(--display);font-weight:900;font-size:19px;line-height:1;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 2px 0 #0003}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.seg{grid-template-columns:1fr}}
.seg button{appearance:none;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.seg button b{display:block;font-size:16px}.seg button small{display:block;font-size:12px;color:var(--muted)}
.seg .hball{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;border:2px solid var(--muted);color:var(--muted)}
.seg button[aria-checked="true"]{border:2px solid var(--rope)}
.seg button[aria-checked="true"] .hball{background:var(--rope);border-color:var(--rope);color:#fff}
.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.styles{grid-template-columns:repeat(2,1fr)}}
.stl{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.stl .fig{width:100%;max-width:130px;height:auto}
.stl b{font-size:15px}.stl small{font-size:11px;color:var(--muted);line-height:1.3}
.stl.on{border:2px solid var(--rope)}.stl.on b{color:var(--rope)}
/* estilos do boneco */
.fig.fs-esboco .sk{fill:none;stroke:var(--figr);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.fig.fs-esboco .sk.l{stroke:var(--figl);stroke-width:2.4;opacity:1}
.fig.fs-esboco .sk.r{opacity:.45}
.fig.fs-esboco .sk.skf{stroke-width:6}
.fig.fs-esboco .skh{stroke-width:2}
.fig.fs-esboco .skg{fill:var(--figr);fill-opacity:.25;stroke:var(--figr);stroke-width:2}
.fig.fs-esboco .skg.l{fill:var(--figl);fill-opacity:.55;stroke:var(--figl)}
.fig.fs-neon{--figl:#FF5A4E;--figr:#55D0F5}
.fig.fs-neon .b{stroke-width:3.5}
.fig.fs-neon .b.r{opacity:.75}
.fig.fs-neon .fmain{filter:drop-shadow(0 0 3px var(--figr)) drop-shadow(0 0 2px var(--figl))}
.fig.fs-neon .hd{fill:none;stroke-width:3}
.fig.fs-neon .gl{fill:none;stroke:var(--figr);stroke-width:3}.fig.fs-neon .gl.l{stroke:var(--figl)}
.fig.fs-neon .fghost{opacity:.4}
.fig.fs-neon .foot{stroke-width:6}
/* contador de dias: sino do ringue com o número no centro */
.streak{position:relative;width:46px;height:42px;flex:0 0 auto;display:grid;place-items:center}
.streak svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 2px 0 #0003)}
.streak b{position:relative;font-family:var(--display);font-weight:900;font-size:20px;line-height:1;color:#1b1405;margin:0;font-variant-numeric:tabular-nums}
.streak .bdome{fill:var(--bell)}
.streak.zero .bdome{fill:var(--line)}
.streak.zero b{color:var(--muted)}
.streak.two b{font-size:16px}.streak.three b{font-size:12px}
/* configurações */
.conf{appearance:none;cursor:pointer;border:0;background:none;padding:0;width:46px;height:42px;flex:0 0 auto;display:grid;place-items:center;transition:transform .15s}
.conf svg{width:46px;height:42px;filter:drop-shadow(0 2px 0 #0003)}
.conf:hover{transform:rotate(-8deg)}
.modal{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cfgbody{display:flex;flex-direction:column;gap:12px}

.bnav button{appearance:none;cursor:pointer;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
.bnav svg{width:24px;height:24px}
.bnav button.on{color:var(--rope)}
.bnav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--rope)}

/* boneco */
.fig{display:block;overflow:visible}
.fig .b{stroke:var(--figr);stroke-width:5;stroke-linecap:round;fill:none}
.fig .b.l{stroke:var(--figl)}
.fig .b.r{opacity:.45}
.fig .hd{fill:var(--fighd);stroke:var(--figr);stroke-width:4}
.fig .gl{fill:var(--figr)}.fig .gl.l{fill:var(--figl)}.fig .gl.r{opacity:.6}
.fig .fground{stroke:var(--line);stroke-width:2;stroke-dasharray:3 5}
.fig .ftrail{fill:none;stroke:var(--bell);stroke-width:2;stroke-dasharray:4 4}
.fig .foot{stroke-width:9}
.fig .arrow{stroke-width:3}
.fig .fhead{fill:var(--figr)}
.fig .opp{fill:none;stroke:var(--figr);opacity:.5;stroke-dasharray:3 3;stroke-width:1.5}
.fig .opplbl{font:600 8px var(--body);fill:var(--figr);opacity:.6}
.fig .fghost{opacity:.22}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#0a1020b3;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.sheet .mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h3{font-size:30px}
.mstage{background:var(--panel2);border-radius:16px;display:grid;place-items:center;padding:10px}
.mstage .fig{width:100%;max-width:300px;height:auto}
.legend2{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);font-weight:600}
.legend2 i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px;background:var(--rope)}
.legend2 i.r{background:var(--ink);opacity:.45}
.err{font-size:14px;color:var(--muted);border-left:3px solid var(--bell);padding-left:10px}
.x{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--panel2);width:38px;height:38px;border-radius:10px;font-size:20px;line-height:1;flex:0 0 auto}

/* cronômetro */
.player{position:fixed;inset:0;z-index:40;background:var(--herobg);color:var(--herofg);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .3s}
.player.k-round{background:#8E1F1A}
.player.k-rest{background:#22574A}
.player.k-cond{background:#7A5712}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.pbar{height:6px;background:#ffffff2e;margin-top:10px;border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:#fff;width:0}
.pmain{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;min-height:0}
.ptag{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.ptitle{font-family:var(--display);font-size:clamp(26px,6.5vw,48px);font-weight:900;text-transform:uppercase;line-height:1;max-width:20ch}
.psub{font-size:15px;opacity:.85;max-width:44ch}
.pfigwrap{flex:1 1 auto;min-height:110px;max-height:34vh;width:100%;display:flex;justify-content:center;margin:4px 0}
.pfigwrap .fig{height:100%;width:auto;max-width:100%;--figl:#FFD9A0;--figr:#ffffff;--fighd:transparent}
.pfigwrap .fig .fground{stroke:#ffffff40}
.ptime{font-family:var(--display);font-weight:900;font-size:clamp(76px,22vw,170px);line-height:.9;font-variant-numeric:tabular-nums}
.pcall{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,52px);text-transform:uppercase;min-height:1.1em;line-height:1.05;color:#FFD9A0}
.pcall.flash{animation:fl .5s ease}
@keyframes fl{from{transform:scale(1.15)}to{transform:scale(1)}}

    const cx0=Math.max(0,Math.floor(x0/PX)),cx1=Math.min(PW-1,Math.floor(x1/PX)),cy0=Math.max(0,Math.floor(y0/PX)),cy1=Math.min(PH-1,Math.floor(y1/PX));
    for(let y=cy0;y<=cy1;y++)for(let x=cx0;x<=cx1;x++){const px=(x+.5)*PX,py=(y+.5)*PX;let hit;
      if(sh.t==="c")hit=segDist(px,py,sh.a,sh.b)<=sh.w/2;else if(sh.t==="o")hit=Math.hypot(px-sh.c[0],py-sh.c[1])<=sh.r;else hit=px>=x0&&px<=x1&&py>=y0&&py<=y1;
      if(hit)g[y*PW+x]=sh.col}});
  const by={};for(let y=0;y<PH;y++){let x=0;while(x<PW){const c=g[y*PW+x];if(!c){x++;continue}let e=x;while(e+1<PW&&g[y*PW+e+1]===c)e++;(by[c]=by[c]||[]).push(`M${x*PX} ${y*PX}h${(e-x+1)*PX}v${PX}h-${(e-x+1)*PX}z`);x=e+1}}
  return Object.entries(by).map(([c,d])=>`<path d="${d.join("")}" fill="${c}" shape-rendering="crispEdges"/>`).join("")}
const PXC={sk:"#F0B27A",skr:"#C98B5A",top:"#F4F4F4",sh:"#2B4C9B",gl:"#E23B2E",glr:"#A82A21",boot:"#262626",hair:"#3B2414",eye:"#111111"};

  if(view==="top")return[c("rfh","rft",10,PXC.glr),c("lfh","lft",10,PXC.gl),c("c","d",4,"#7D8AA0")];

const STRIKE={1:J,2:X,3:H3,4:H4,5:U5,6:U6};

const SLo=bend(mv(S,UK,9,0),10);
const PDs=bend(mv(S,UK,10,0),28);

// Combinações: transforma "1-2, esquiva, 3" em uma sequência de poses
function comboAnim(call){
  const fr=[[S,0,120]];const L=String(call||"").toLowerCase();
  const push=(p,ms=170,h=40)=>{fr.push([p,ms,h])};
  if(/burpee/.test(L)){ANIM.burpee.frames.slice(1).forEach(f=>fr.push([f[0],f[1]*.8,f[2]]));fr.push([S,260,200])}
  else if(/rajada|socos r/.test(L)&&!/\d/.test(L)){for(let i=0;i<3;i++){push(J,100,10);push(S,90,0);push(X,100,10);push(S,90,0)}}
  L.split(",").forEach(seg=>{seg=seg.trim();const body=/corpo|fígado/.test(seg);
    if(/esquiva/.test(seg)){const n=(seg.match(/esquiva/g)||[]).length;for(let i=0;i<n;i++){push(SLo,180,80);push(S,160,0)}}
    if(/pêndulo/.test(seg)){const n=(seg.match(/pêndulo/g)||[]).length;for(let i=0;i<n;i++){push(PDs,260,0);push(S,240,0)}}
    if(/pull back|recua/.test(seg)){push(PB,200,120);push(S,160,0)}
    if(/parry|aparou/.test(seg)){push(PR,130,60);push(S,130,0)}
    if(/bloqueia/.test(seg)){push(BL,160,200);push(S,160,0)}
    if(/shoulder roll/.test(seg)){push(SR,220,220);push(S,180,0)}
    if(/check hook/.test(seg)){push(H3,150,0);push(CH,240,200);push(S,260,0)}
    if(/finta/.test(seg)){push(FT,120,60);push(S,110,0)}
    if(/agacha/.test(seg)){push(bend(S,26),260,80);push(S,220,0)}
    if(/saltita|pernas/.test(seg)){for(let i=0;i<3;i++){push(all(S,0,-7),140,0);push(S,140,0)}}
    if(/pivô|l-step|ângulo|circula|passo lateral|sai pra|troca de base/.test(seg)&&!/\d/.test(seg)){push(all(S,10,0),220,100);push(S,240,0)}
    const m=seg.match(/\d(?:-\d)*/g);if(m)m.forEach(g=>g.split("-").forEach((d,i,arr)=>{const st=(body&&i===0)?BODY[d]:STRIKE[d];if(!st)return;push(st,d==="1"?150:180,50);if(i<arr.length-1)push(md(S,{h:st.h}),120,0)}));
    if(m)push(S,170,0);
  });
  fr.push([S,200,300]);
  return {view:"body",frames:fr};
}

function warmSteps(total){const out=[];let t=0;for(const w of WARM){if(t>=total)break;const d=Math.min(w[2],total-t);out.push({k:"warm",tag:"Aquecimento",title:w[0],sub:w[1],dur:d});t+=d}return out}
function coolSteps(total){const out=[];let t=0;for(const w of COOL){if(t>=total)break;const d=Math.min(w[2],total-t);out.push({k:"cool",tag:"Volta à calma",title:w[0],sub:w[1],dur:d});t+=d}return out}

function dayInfo(n){const i=n-1,w=Math.floor(i/7);return{n,i,w,phase:w%4,cycle:Math.floor(w/4)+1,di:i%7,wk:(w%4)+1}}
function pick(F,lv,c){
  if(lv==="basico")return{rounds:F.basico.rounds,calls:c>=2?[...F.basico.calls,"1-2-3-2","Esquiva, 2-3"]:F.basico.calls};
  if(lv==="intermediario")return{rounds:c%2===0?F.alt.rounds:F.inter.rounds,calls:c>=2?[...F.inter.calls,...F.alt.calls]:F.inter.calls};
  return{rounds:c%2===0?F.alt.rounds:F.pro.rounds,calls:[...F.inter.calls.slice(4),...F.alt.calls,...F.pro.calls,...F.pro.calls]};
}
function buildDay(lv,n){
  const L=LEVELS[lv],I=dayInfo(n),W=L.weeks[I.phase],c=I.cycle;
  if(I.di===6){
    const steps=[...warmSteps(300)];
    for(let r=0;r<3;r++){steps.push({k:"round",tag:`Round ${r+1} de 3 · leve`,title:["Técnica lenta, espelho mental","Jab e movimento solto","Livre, 50% da força"][r],sub:"Sem pressa. Foco em forma perfeita e respiração.",dur:180,calls:null});if(r<2)steps.push({k:"rest",tag:"Descanso",title:"Respira",sub:"",dur:60})}
    steps.push(...coolSteps(240));
    return {...I,lv,rec:true,week:W,name:"Recuperação ativa",desc:"Dia de descanso. Se quiser se mexer, faça este treino leve de 20 minutos. Se preferir parar totalmente, também vale.",steps};
  }
  const F=FOCI[I.di],P=pick(F,lv,c);
  const every=Math.max(5,W.every-Math.min(c-1,2));
  const finish=W.finish;
  const steps=[...warmSteps(W.warm)];
  const all=P.rounds;const R=W.rounds;
  const titles=R<=6?(R===6?all:[...all.slice(0,R-1),all[5]]):[...all.slice(0,5),...F[lv==="avancado"?"alt":"inter"].rounds.slice(0,R-6),all[5]];
  titles.forEach((t,r)=>{
    steps.push({k:"round",tag:`Round ${r+1} de ${R}`,title:t,sub:finish?`Últimos ${finish} s em ritmo máximo`:(I.phase===0&&lv==="basico"?"Devagar e certo. Técnica antes de velocidade":"Técnica limpa, guarda sempre alta"),dur:W.work,calls:P.calls,every,finish});
    if(r<titles.length-1)steps.push({k:"rest",tag:"Descanso",title:"Respira e solta os braços",sub:"",dur:W.rest});
  });
  const sets=["A","B","C","D"];const set=c>=2&&lv!=="basico"?sets[(sets.indexOf(W.cond.set)+c-1)%4]:W.cond.set;const CL=COND[set];
  for(let j=0;j<W.cond.n;j++){const cx=CL[j%CL.length];steps.push({k:"cond",tag:`Condicionamento ${j+1}/${W.cond.n}`,title:cx[0],sub:cx[1],dur:W.cond.work});steps.push({k:"rest",tag:"Pausa",title:"Recupera",sub:"",dur:W.cond.rest})}
  steps.push(...coolSteps(W.cool));
  return {...I,lv,rec:false,week:W,name:F.name,desc:F.desc,mus:F.mus,steps,every,adv:c>=2};
}

function techForDay(d){
  if(d.rec)return["base","guarda","esquiva"].filter(k=>TECH[k]);
  let ks=FOCUS_TECH[d.di].filter(k=>TECH[k]);
  if(d.lv==="basico")ks=ks.filter(k=>!NOT_BASIC.has(k));else if(d.lv==="intermediario")ks=ks.filter(k=>!ADV.has(k));
  if(d.lv==="avancado")ks=[...ks.filter(k=>ADV.has(k)),...ks.filter(k=>!ADV.has(k))];
  const cond=[...new Set(d.steps.filter(s=>s.k==="cond").map(s=>COND_AK[s.title]).filter(Boolean))];
  return [...ks,...cond.filter(k=>!ks.includes(k))];

function timeline(d){
  const rows=[];
  d.steps.forEach(s=>{
    if(s.k==="rest"&&rows.length&&rows[rows.length-1].k==="cond"){rows[rows.length-1].dur+=s.dur;return}
    if(s.k==="rest"){const p=rows[rows.length-1];if(p&&p.k==="rests"){p.n++;p.dur+=s.dur}else rows.push({k:"rests",n:1,dur:s.dur,one:s.dur});return}
    if(s.k==="round"){rows.push({k:"round",nm:s.title,sub:s.tag,dur:s.dur});return}
    const last=rows[rows.length-1];if(last&&last.k===s.k){last.items.push(s.title);last.dur+=s.dur;return}
    rows.push({k:s.k,items:[s.title],dur:s.dur});
  });
  const name={warm:"Aquecimento",cond:"Condicionamento",cool:"Volta à calma"};
  return `<ul class="tl">${rows.filter(r=>r.k!=="rests").map(r=>r.k==="round"?`<li><span class="dot round"></span><span class="nm">${esc(sw(r.nm))}<small>${r.sub}</small></span><span class="d">${fmt(r.dur)}</span></li>`:`<li><span class="dot ${r.k}"></span><span class="nm">${name[r.k]}<small>${r.items.map(esc).join(" · ")}</small></span><span class="d">${fmt(r.dur)}</span></li>`).join("")}</ul>${d.steps.some(s=>s.k==="rest")?`<p class="note" style="margin:0">Descanso entre rounds: ${fmt(d.steps.find(s=>s.k==="rest").dur)}.</p>`:""}`;
}

  host.innerHTML=`<div class="sec-h"><h2>Técnicas</h2><button type="button" class="linkbtn" id="goStyle">Trocar estilo do boneco</button></div>
  <div class="filters" role="tablist">${cats.map(c=>`<button type="button" class="${c===techFilter?"on":""}" data-f="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="tgrid">${list.map(t=>`<div class="tcard"><span data-static="${t.key}"></span><div style="min-width:0"><h4>${t.num?`<b>${t.num}</b>`:""}${esc(sw(t.name))}${t.adv?'<span class="tag">Avançado</span>':""}</h4><p>${esc(sw(t.desc))}</p><button type="button" class="vbtn" data-tech="${t.key}">${ICO.eye} Ver movimento</button></div></div>`).join("")}</div>
  <p class="note">No desenho, o vermelho é o lado da frente. Você está no modo ${store.hand==="C"?"canhoto (C): pé e mão direitos à frente":"destro (D): pé e mão esquerdos à frente"}. Para trocar, toque na luva CONF no topo.</p>`;
  host.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{techFilter=b.dataset.f;renderTecnicas()});
  $("goStyle").onclick=()=>{openConfig();setTimeout(()=>{const e=document.querySelector("#cfg .styles");if(e)e.scrollIntoView({behavior:"smooth",block:"center"})},80)};
  mountStatics(host);wireTech(host);
}
function openTech(k){
  const t=TECH[k];if(!t)return;$("mCat").textContent=t.cat+(t.adv?" · Avançado":"");$("mTitle").textContent=(t.num?t.num+" · ":"")+sw(t.name);$("mDesc").textContent=sw(t.desc);$("mErr").innerHTML="<b>Erro comum:</b> "+esc(sw(t.err));$("mLegL").textContent="lado da frente (mão "+leadHand()+")";$("mLegR").textContent="lado de trás";
  const st=$("mStage");st.innerHTML="";const f=new Fig(st,{ghost:true,label:t.name});f.play(ANIM[k],{force:true});
  $("mPause").textContent="Pausar";$("mSlow").textContent="Câmera lenta";
  $("mPause").onclick=()=>{f.setPaused(!f.paused);$("mPause").textContent=f.paused?"Continuar":"Pausar"};
  $("mSlow").onclick=()=>{const s=f.speed===1?.4:1;f.setSpeed(s);$("mSlow").textContent=s===1?"Câmera lenta":"Velocidade normal"};
  $("modal").hidden=false;openTech.f=f;setTimeout(()=>$("mClose").focus(),50);
}
function closeModal(){$("modal").hidden=true;if(openTech.f)openTech.f.stop()}
$("mClose").onclick=closeModal;$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("modal").hidden)closeModal()});

// ---------- PROGRESSO ----------
function renderProgresso(){
  const host=$("tab-progresso");const all=LKEYS.flatMap(k=>Object.values(store.prog[k]));const ds=allDates();
  const now=new Date();const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7)-7*11);
  const cells=[];for(let i=0;i<84;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=ymd(d);cells.push(`<i class="${ds.has(k)?"on":""}${k===today()?" today":""}" title="${k.split("-").reverse().join("/")}"></i>`)}
  host.innerHTML=`<div class="sec-h"><h2>Progresso</h2></div>
  <div class="stats"><div class="stat"><b>${all.length}</b><small>treinos</small></div><div class="stat"><b>${all.reduce((a,x)=>a+(x.min||0),0)}</b><small>minutos</small></div><div class="stat"><b>${streak()}</b><small>dias seguidos</small></div><div class="stat"><b>${bestStreak()}</b><small>maior sequência</small></div></div>
  <div class="card"><div class="sec-h"><h3>Últimas 12 semanas</h3><span class="eyebrow">cada quadrado é um dia</span></div><div class="heat">${cells.join("")}</div></div>
  <div class="card"><h3>Por nível</h3>${LKEYS.map(k=>{const nd=Object.keys(store.prog[k]).length;return `<div class="lbar"><span>${LEVELS[k].name}</span><div><i style="width:${Math.min(100,nd/28*100)}%"></i></div><span>${nd}/28</span></div>`}).join("")}<p class="note" style="margin:0">A barra mostra o primeiro ciclo de 28 dias de cada nível.</p></div>`;
}
function renderConfig(){
  const host=$("cfgBody");
  host.innerHTML=`<div class="card"><h3>Sua guarda</h3>
    <div class="seg" role="radiogroup" aria-label="Guarda"><button type="button" role="radio" aria-checked="${store.hand==="D"}" data-hand="D"><span class="hball">D</span><span><b>Destro</b><small>Guarda ortodoxa · esquerda à frente</small></span></button><button type="button" role="radio" aria-checked="${store.hand==="C"}" data-hand="C"><span class="hball">C</span><span><b>Canhoto</b><small>Guarda canhota · direita à frente</small></span></button></div>
    <p class="note" style="margin:0">A numeração não muda: 1 é sempre o jab da mão da frente, 2 o direto da mão de trás. Os desenhos e os textos se ajustam ao lado escolhido.</p>
  </div>
  <div class="card"><h3>Estilo do boneco</h3>
    <div class="styles">${Object.entries(FIG_STYLES).map(([k,v])=>`<button type="button" class="stl${store.figStyle===k?" on":""}" data-style="${k}" aria-pressed="${store.figStyle===k}"><span class="stlfig" data-prev="${k}"></span><b>${v.name}</b><small>${v.desc}</small></button>`).join("")}</div>
  </div>
  <div class="card"><h3>App e som</h3>
    <div class="set"><span>Chamar combinações por voz</span><button type="button" class="switch" role="switch" aria-checked="${store.voice}" id="sVoice" aria-label="Voz"></button></div>
    <div class="set"><span>Sinal sonoro (sino e bipes)</span><button type="button" class="switch" role="switch" aria-checked="${store.beep}" id="sBeep" aria-label="Som"></button></div>
    <p class="note" style="margin:0">Instale o Round Fantasma na tela inicial. No Android (Chrome): toque em Instalar app ou no menu ⋮ › Instalar app. No iPhone (Safari): Compartilhar › Adicionar à Tela de Início. Depois de aberto uma vez com internet, ele funciona offline, com voz, cronômetro e animações. Para trazer o progresso de outra versão, use o backup abaixo.</p>
    <div class="rowbtns"><button type="button" class="btn primary" id="bInstall" hidden>Instalar app</button><button type="button" class="btn" id="bkCopy">Copiar meu progresso</button></div>
    <label for="bkIn" class="eyebrow">Colar progresso</label><textarea id="bkIn" placeholder="Cole aqui o código copiado na outra versão"></textarea>
    <div class="rowbtns"><button type="button" class="btn" id="bkLoad">Restaurar progresso</button></div>
  </div>`;
  host.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>setHand(b.dataset.hand));
  host.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{store.figStyle=b.dataset.style;save();syncFig();renderAll();toast("Estilo "+FIG_STYLES[store.figStyle].name)});
  host.querySelectorAll("[data-prev]").forEach(el=>{const f=new Fig(el,{style:el.dataset.prev,ghost:el.dataset.prev==="neon",label:"Prévia do estilo "+FIG_STYLES[el.dataset.prev].name});f.play(comboAnim("1-2-3"),{force:true})});
  $("sVoice").onclick=()=>{store.voice=!store.voice;save();renderConfig()};
  $("sBeep").onclick=()=>{store.beep=!store.beep;save();renderConfig()};
  $("bkCopy").onclick=async()=>{const code="RF1:"+btoa(unescape(encodeURIComponent(JSON.stringify({level:store.level,prog:store.prog}))));try{await navigator.clipboard.writeText(code);toast("Código copiado")}catch(e){$("bkIn").value=code;$("bkIn").select();toast("Selecione e copie o código")}};
  $("bkLoad").onclick=()=>{try{const raw=$("bkIn").value.trim().replace(/^RF1:/,"");const v=JSON.parse(decodeURIComponent(escape(atob(raw))));LKEYS.forEach(k=>Object.assign(store.prog[k],(v.prog||{})[k]||{}));if(v.level)store.level=v.level;save();selHoje=null;selPlan=nextN();renderAll();toast("Progresso restaurado")}catch(e){toast("Código inválido. Copie de novo na outra versão.")}};
}
function openConfig(){renderConfig();$("cfg").hidden=false;setTimeout(()=>$("cfgClose").focus(),50)}
function closeConfig(){$("cfg").hidden=true;$("cfgBody").innerHTML=""}
$("cConf").onclick=openConfig;$("cfgClose").onclick=closeConfig;
$("cfg").addEventListener("click",e=>{if(e.target.id==="cfg")closeConfig()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("cfg").hidden)closeConfig()});

function setHand(h){store.hand=h;save();syncFig();renderAll();toast(h==="C"?"Canhoto: pé e mão direitos à frente":"Destro: pé e mão esquerdos à frente")}
// ---------- navegação ----------
const TABS=["hoje","plano","tecnicas","progresso"];let curTab="hoje";
function showTab(t,push){if(!TABS.includes(t))t="hoje";curTab=t;TABS.forEach(x=>{$("tab-"+x).classList.toggle("on",x===t)});document.querySelectorAll(".bnav button").forEach(b=>{b.classList.toggle("on",b.dataset.tab===t);b.setAttribute("aria-current",b.dataset.tab===t?"page":"false")});
  if(push){try{history.replaceState(null,"","#"+t)}catch(e){location.hash=t}}window.scrollTo({top:0})}
document.querySelectorAll(".bnav button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab,true));
window.addEventListener("hashchange",()=>showTab(location.hash.slice(1)));
function renderTop(){const n=streak(),el=$("cStreak");el.className="streak"+(n?"":" zero")+(n>9?" two":"")+(n>99?" three":"");el.setAttribute("aria-label",n+(n===1?" dia seguido":" dias seguidos"));el.title=el.getAttribute("aria-label");
  el.innerHTML=`<svg viewBox="0 0 54 50" aria-hidden="true"><rect x="21" y="1" width="12" height="48" rx="3" fill="#7A4E2A"/><rect x="23" y="3" width="2" height="44" rx="1" fill="#ffffff22"/><circle cx="27" cy="25" r="19" class="bdome"/><circle cx="27" cy="25" r="19" fill="none" stroke="#00000040" stroke-width="1.5"/><circle cx="27" cy="25" r="14" fill="none" stroke="#00000030" stroke-width="1.5"/><path d="M15 15a16 16 0 0 1 9-5" fill="none" stroke="#ffffff88" stroke-width="2.4" stroke-linecap="round"/><path d="M46 38l6 8" stroke="#7A4E2A" stroke-width="3" stroke-linecap="round"/><circle cx="45" cy="37" r="3.2" fill="#3a3a3a"/></svg><b>${n}</b>`}
function renderAll(){renderTop();renderHoje();renderPlano();renderTecnicas();renderProgresso();if(!$("cfg").hidden)renderConfig();showTab(curTab)}

// ---------- som e voz ----------
let ac=null;
function tone(f,d,when=0,vol=.25){if(!store.beep)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="sine";const t=ac.currentTime+when;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const bell=()=>{tone(1320,.9,0,.3);tone(1320,.9,.25,.3);tone(1320,1.1,.5,.3)};
const pip=()=>tone(880,.15);
const NUM={"1":"um","2":"dois","3":"três","4":"quatro","5":"cinco","6":"seis"};
function speak(t){if(!store.voice||!("speechSynthesis" in window))return;try{const s=t.replace(/\d(?:-\d)*/g,m=>m.split("-").map(x=>NUM[x]).join(", "));speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="pt-BR";u.rate=1.15;speechSynthesis.speak(u)}catch(e){}}

// ---------- cronômetro ----------
let P=null,lock=null,pFig=null;
async function wake(){try{lock=await navigator.wakeLock.request("screen")}catch(e){lock=null}}
function start(d){
  const steps=[{k:"prep",tag:"Prepare-se",title:d.name,sub:"Fica na guarda",dur:5},...d.steps];
  P={d,steps,idx:0,left:steps[0].dur,running:true,last:performance.now(),nextCall:0,lastCall:"",said10:false,saidFin:false,lastPip:null};
  $("player").hidden=false;document.body.style.overflow="hidden";heroTok++;
  $("pFig").innerHTML="";pFig=new Fig($("pFig"),{ghost:true,label:"Demonstração do movimento"});
  wake();enter();loop();
}
function figFor(s){
  if(s.k==="cond")return ANIM[COND_AK[s.title]]||ANIM.base;
  if(s.k==="warm")return ANIM[WARM_AK[s.title]]||ANIM.base;
  if(s.k==="round"||s.k==="prep")return ANIM.base;
  return ANIM.respira;
}
function enter(){
  const s=P.steps[P.idx];P.left=s.dur;P.said10=false;P.saidFin=false;P.nextCall=s.calls?s.dur-4:0;$("pCall").textContent="";
  $("player").className="player"+(["round","rest","cond"].includes(s.k)?" k-"+s.k:"");
  $("pTag").textContent=s.tag;$("pTitle").textContent=sw(s.title);$("pSub").textContent=s.sub||"";
  const n=P.steps[P.idx+1];$("pNext").textContent=n?`A seguir: ${n.title} (${fmt(n.dur)})`:"Último bloco";
  $("pDay").textContent=`Dia ${P.d.n} · ${P.d.name}`;
  if(pFig)pFig.play(figFor(s),{force:true});
  if(s.k==="round"){bell();speak(s.title)}else if(s.k==="cond"){pip();speak(s.title)}else if(s.k==="rest"&&P.idx>0){tone(660,.4)}
  paint();
}
function paint(){
  const s=P.steps[P.idx];$("pTime").textContent=fmt(P.left);
  const all=P.steps.reduce((a,x)=>a+x.dur,0),past=P.steps.slice(0,P.idx).reduce((a,x)=>a+x.dur,0)+(s.dur-P.left);
  $("pBar").style.width=(past/all*100)+"%";$("pLeft").textContent=`Falta ${fmt(all-past)}`;
  $("bPlay").textContent=P.ended?"Fechar":P.running?"Pausar":"Continuar";
}
function call(t){t=sw(t);const c=$("pCall");c.textContent=t;c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash");speak(t);
  if(pFig)pFig.play(comboAnim(t),{loop:false,force:true,onend:()=>{if(P&&P.steps[P.idx].k==="round")pFig.play(ANIM.base,{force:true})}})}
function loop(){
  if(!P)return;const now=performance.now(),dt=(now-P.last)/1000;P.last=now;
  if(P.running&&!P.ended){
    const s=P.steps[P.idx];P.left-=dt;
    if(s.calls&&P.left<=P.nextCall&&P.left>3){
      if(s.finish&&P.left<=s.finish){if(!P.saidFin){P.saidFin=true;call("Ritmo máximo!")}}
      else{let t;do{t=s.calls[Math.floor(Math.random()*s.calls.length)]}while(t===P.lastCall&&s.calls.length>1);P.lastCall=t;call(t)}
      P.nextCall=P.left-s.every;
    }
    if(!P.said10&&P.left<=10&&s.k==="round"){P.said10=true;tone(1000,.12);tone(1000,.12,.18)}
    if(P.left<=3.05&&P.left>0&&s.k!=="round"&&Math.ceil(P.left)!==P.lastPip){P.lastPip=Math.ceil(P.left);pip()}
    if(P.left<=0){if(P.idx<P.steps.length-1){P.idx++;enter()}else{finish();return}}
  }
  paint();requestAnimationFrame(loop);
}
function finish(){bell();speak("Treino concluído. Bom trabalho!");store.prog[P.d.lv][P.d.n]={date:today(),min:Math.round(total(P.d)/60)};save();
  $("pTag").textContent="Treino concluído";$("pTitle").textContent="Bom trabalho, campeão";$("pSub").textContent="Dia "+P.d.n+" marcado como feito. Amanhã tem o próximo.";$("pTime").textContent="0:00";$("pCall").textContent="";$("pNext").textContent="";$("pBar").style.width="100%";
  P.running=false;P.ended=true;$("player").className="player";if(pFig)pFig.play(ANIM.pular,{force:true});paint();selHoje=null;selPlan=nextN();renderAll()}
function exit(){P=null;$("player").hidden=true;document.body.style.overflow="";if(pFig){pFig.stop();pFig=null}try{speechSynthesis.cancel()}catch(e){}try{lock&&lock.release()}catch(e){}renderHoje()}
$("bPlay").onclick=()=>{if(!P)return;if(P.ended){exit();return}P.running=!P.running;P.last=performance.now();if(pFig)pFig.setPaused(!P.running);if(P.running)wake();paint()};
$("bNext").onclick=()=>{if(!P||P.ended)return;if(P.idx<P.steps.length-1){P.idx++;enter()}else finish()};
$("bPrev").onclick=()=>{if(!P||P.ended)return;if(P.steps[P.idx].dur-P.left>3||P.idx===0){enter()}else{P.idx--;enter()}};
$("bExit").onclick=exit;
document.addEventListener("visibilitychange",()=>{if(P&&P.running&&document.visibilityState==="visible")wake()});

curTab=TABS.includes(location.hash.slice(1))?location.hash.slice(1):"hoje";
renderAll();
window.RF={LEVELS,FOCI,GUIDE,DAY,ANIM,TECH,comboAnim};

})();
</script>

<script>
(function(){
  if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})})}
  let dp=null;
  const sync=()=>{const b=document.getElementById("bInstall");if(b)b.hidden=!dp};
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;sync()});
  window.addEventListener("appinstalled",()=>{dp=null;sync()});
  document.addEventListener("click",async e=>{if(e.target&&e.target.id==="bInstall"&&dp){dp.prompt();try{await dp.userChoice}catch(_){}dp=null;sync()}});
  const t=document.getElementById("cfgBody");if(t)new MutationObserver(sync).observe(t,{childList:true});
})();
</script>
