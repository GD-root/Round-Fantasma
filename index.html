<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Shadowboxing: boxe de sombra diário em três níveis, com cronômetro guiado por voz e boneco animado que mostra cada movimento.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadowboxing">

<title>Shadowboxing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<!-- Contagem anônima de acessos (GoatCounter: sem cookies; só o dono vê os números) -->
<script data-goatcounter="https://gdapps.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>


<div class="fundo-ac" id="fundoAc" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M13 10v8M13 13l6-2M13 13l-4 4M13 18l5 6M13 18l-5 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19 11l5-1" stroke="var(--rope)" stroke-width="2.4" stroke-linecap="round"/></svg>Shadow<span>boxing</span></div>
    <div class="chips"><span class="streak" id="cStreak" role="img"></span><button type="button" class="conf" id="cConf" aria-label="Configurações" title="Configurações"><svg viewBox="0 0 54 50" aria-hidden="true"><path d="M10 35V16a11 11 0 0 1 11-11h17a11 11 0 0 1 11 11v8a11 11 0 0 1-11 11z" fill="var(--rope)"/><path d="M12 21c-5-1-9 2-9 7s4 7 8 7h3z" fill="var(--rope)" stroke="#00000033" stroke-width="1.2"/><path d="M15 10a8 8 0 0 1 6-3" fill="none" stroke="#ffffff66" stroke-width="2.4" stroke-linecap="round"/><rect x="12" y="35" width="30" height="10" rx="3" fill="var(--ink)"/><rect x="12" y="39" width="30" height="2" fill="#ffffff55"/><text x="30.5" y="24.5" text-anchor="middle" font-family="Barlow,Arial,Helvetica,sans-serif" font-weight="800" font-size="10.5" fill="#fff">CONF</text></svg></button></div>
  </header>

  <main>
    <section class="tab" id="tab-hoje" aria-label="Hoje"></section>
    <section class="tab" id="tab-plano" aria-label="Plano"></section>
    <section class="tab" id="tab-tecnicas" aria-label="Técnicas"></section>
    <section class="tab" id="tab-progresso" aria-label="Evolução"></section>
  </main>
</div>

<nav class="bnav" aria-label="Navegação"><div>
  <button type="button" data-tab="hoje"><span class="bola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18M6 4v4M18 4v4"/><circle cx="12" cy="13" r="6"/><circle cx="12" cy="13" r="2.2"/><path d="M20 22l-3.5-3.5"/></svg></span>Hoje</button>
  <button type="button" data-tab="plano"><span class="bola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7a5 5 0 0 1 5 5v6a7 7 0 0 1-7 7h-1a5 5 0 0 1-5-5V4z"/><circle cx="12.5" cy="11" r="3.2"/><path d="M7 17h-2a2 2 0 0 1 0-4h2"/></svg></span>Plano</button>
  <button type="button" data-tab="tecnicas"><span class="bola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16.8V15.4c-2.2 0-3.6-1.4-3.6-3.2 0-1.7 1.3-2.9 2.9-2.9H9"/><path d="M7.4 9.4V8a5.6 5.6 0 0 1 11.2 0v5.2a4.4 4.4 0 0 1-4.4 4.4H8"/><rect x="7.4" y="17.6" width="10.2" height="4" rx="1.2"/><path d="M12.5 17.6v4M11 8.5c1.6-.8 3.4-.8 5 0"/></svg></span>Técnicas</button>
  <button type="button" data-tab="progresso"><span class="bola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 9.5h5M17.5 9.5h5M1.5 14.5h5M17.5 14.5h5"/><rect x="6.5" y="6" width="11" height="12" rx="4"/><path d="M12 9l1 2h2l-1.6 1.3.6 2.2-2-1.3-2 1.3.6-2.2L9 11h2z"/></svg></span>Evolução</button>
</div></nav>

<div class="modal cfgm" id="cfg" hidden role="dialog" aria-modal="true" aria-labelledby="cfgTitle">
  <div class="sheet">
    <div class="mhead"><div><div class="eyebrow">Shadowboxing</div><h3 id="cfgTitle">Configurações</h3></div><button type="button" class="x" id="cfgClose" aria-label="Fechar">×</button></div>
    <div id="cfgBody" class="cfgbody"></div>
  </div>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <div class="mhead"><div><div class="eyebrow" id="mCat"></div><h3 id="mTitle"></h3></div><button type="button" class="x" id="mClose" aria-label="Fechar">×</button></div>
    <div class="mstage" id="mStage"></div>
    <div class="legend2"><span><i></i><span id="mLegL">lado da frente</span></span><span><i class="r"></i><span id="mLegR">lado de trás</span></span></div>
    <div class="rowbtns"><button type="button" class="btn" id="mPause">Pausar</button><button type="button" class="btn" id="mSlow">Câmera lenta</button></div>
    <p id="mDesc" style="margin:0"></p>
    <p class="err" id="mErr" style="margin:0"></p>
    <p class="mmus" id="mMus" style="margin:0"></p>
  </div>
</div>

<div class="player" id="player" hidden>
  <div class="pfundo" id="pFundo" aria-hidden="true"></div>
  <div class="ptop"><span id="pDay"></span><span id="pLeft"></span></div>
  <div class="pbar"><i id="pBar"></i></div>
  <div class="pmain">
    <div class="ptag" id="pTag"></div>
    <div class="ptitle" id="pTitle"></div>
    <div class="psub" id="pSub"></div>
    <div class="pfigwrap" id="pFig"></div>
    <div class="ptime" id="pTime">0:00</div>
    <div class="pcall" id="pCall"></div>
    <div class="pnext" id="pNext"></div>
  </div>
  <div class="pctl">
    <button id="bPrev" type="button">Voltar</button>
    <button id="bPlay" type="button" class="main">Pausar</button>
    <button id="bNext" type="button">Pular</button>
    <button id="bExit" type="button">Sair</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
